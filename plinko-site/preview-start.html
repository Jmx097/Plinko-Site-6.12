<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PREVIEW — Start Here | Plinko Solutions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --paper: #faf8f3; --paper-2: #f3f0e9; --ink: #211e1a; --muted: #8a8478; --line: #e5e1d8;
  --dot-grey: #d9d5cc; --green: #57b176; --green-deep: #3e9c63; --green-dark: #2c7a4b;
  --amber: #e3a51c; --red: #d6453a; --red-dark: #b9342a;
  --serif: 'Newsreader', Georgia, serif; --mono: 'IBM Plex Mono', monospace; --sans: 'Inter', sans-serif;
  --radius: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 17px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--serif); font-weight: 500; line-height: 1.12; letter-spacing: -0.01em; }
.nav { position: fixed; top: 0; left: 0; right: 0; z-index: 50; background: rgba(250,248,243,.88); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.nav-inner { max-width: 1080px; margin: 0 auto; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 20px; font-weight: 600; text-decoration: none; color: inherit; }
.brand-dots { display: grid; grid-template-columns: repeat(2, 8px); gap: 3px; }
.brand-dots span { width: 8px; height: 8px; border-radius: 2px; background: var(--dot-grey); }
.brand-dots span:nth-child(3) { background: var(--green); }
.brand-dots span:nth-child(4) { background: var(--red); }
.btn { display: inline-block; text-decoration: none; font-weight: 600; font-size: 15px; padding: 12px 22px; border-radius: 8px; border: none; cursor: pointer; transition: transform .12s, background .15s; font-family: var(--sans); }
.btn:hover { transform: translateY(-1px); }
.btn-green { background: var(--green-deep); color: #fff; }
.btn-red { background: var(--red); color: #fff; }
.nav .btn { padding: 9px 16px; font-size: 14px; }
.kicker { font-family: var(--mono); font-size: 13px; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; gap: 10px; }
.kicker .sw, .story-stat .sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; flex: none; }
.story-stat { font-family: var(--mono); font-size: 14px; display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.wizard { max-width: 680px; margin: 0 auto; width: 100%; padding: 150px 24px 96px; }
.wizard h1 { font-size: clamp(30px, 4.5vw, 44px); margin: 14px 0 10px; }
.wiz-sub { color: var(--muted); margin-bottom: 32px; }
.wiz-intro p { color: var(--muted); margin: 14px 0 30px; }
.wiz-progress { display: flex; align-items: center; gap: 6px; margin-bottom: 28px; font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.wiz-progress span { width: 11px; height: 11px; border-radius: 3px; background: var(--dot-grey); }
.wiz-progress span.f { background: var(--green); }
.wiz-progress em { font-style: normal; margin-left: 8px; }
.wiz-options { display: grid; gap: 12px; }
.wiz-option { text-align: left; background: #fff; border: 1.5px solid var(--line); border-radius: var(--radius); padding: 18px 22px; cursor: pointer; font-family: var(--sans); font-size: 16px; display: flex; flex-direction: column; gap: 4px; transition: border-color .12s, transform .12s; }
.wiz-option:hover { border-color: var(--green-deep); transform: translateY(-1px); }
.wiz-option strong { font-weight: 600; }
.wiz-option span { color: var(--muted); font-size: 14.5px; }
.wiz-back, .wiz-restart { background: none; border: none; cursor: pointer; font-family: var(--mono); font-size: 13px; color: var(--muted); margin-top: 26px; padding: 0; }
.wiz-back:hover, .wiz-restart:hover { color: var(--ink); }
.wiz-result-head { display: flex; gap: 32px; align-items: center; margin-bottom: 36px; }
.wiz-result-head h1 { margin: 10px 0 8px; }
.mini-grid { display: grid; grid-template-columns: repeat(10, 13px); gap: 4px; flex: none; }
.mini-grid span { width: 13px; height: 13px; border-radius: 3.5px; display: block; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(214,69,58,.45); } 50% { box-shadow: 0 0 0 10px rgba(214,69,58,0); } }
.you-dot { animation: pulse 2s infinite; }
@media (max-width: 640px) { .wiz-result-head { flex-direction: column; align-items: flex-start; } }
.wiz-steps { list-style: none; display: grid; gap: 16px; margin-bottom: 32px; }
.wiz-steps li { display: flex; gap: 16px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 22px; }
.wiz-step-n { font-family: var(--mono); font-size: 13px; color: #fff; background: var(--green-deep); width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex: none; margin-top: 2px; }
.wiz-steps p { color: var(--muted); font-size: 15px; margin-top: 4px; }
.wiz-bridge { border-left: 3px solid var(--red); padding: 4px 0 4px 18px; margin-bottom: 36px; font-family: var(--serif); font-size: 18px; font-style: italic; }
.wiz-tier { background: #fff; border: 1.5px solid var(--green-deep); border-radius: var(--radius); padding: 30px; }
.wiz-tier h3 { font-size: 24px; margin: 10px 0 8px; }
.wiz-tier p { color: var(--muted); font-size: 15.5px; margin-bottom: 22px; }
.wiz-tier .wiz-restart { margin-left: 18px; margin-top: 0; }
</style>
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="preview.html">
      <span class="brand-dots"><span></span><span></span><span></span><span></span></span>
      Plinko Solutions
    </a>
    <a class="btn btn-green" href="https://cal.com/jonathan-mclemore-t2zmlc/steppingstones?duration=15">Book a Strategy Session</a>
  </div>
</nav>
<div id="app"></div>

<script>
const CAL = 'https://cal.com/jonathan-mclemore-t2zmlc/steppingstones?duration=15';
const COLOR = { grey:'#d9d5cc', green:'#57b176', amber:'#e3a51c', red:'#d6453a' };

const QUESTIONS = [
  { id:'usage', q:'Have you used AI before?', sub:'Be honest — most of the world hasn’t. That’s fine.', options:[
    { v:'grey', label:'Never, or barely', desc:'I’ve heard about it. Maybe clicked once.' },
    { v:'green', label:'I chat with a free AI sometimes', desc:'ChatGPT, Claude, Gemini — the free version.' },
    { v:'amber', label:'I pay for AI tools', desc:'A $20/mo subscription, or a few of them.' },
    { v:'red', label:'I run AI agents or automations', desc:'Things happen without me typing every prompt.' } ] },
  { id:'team', q:'Who would this be for?', sub:'No wrong answer — it changes the first steps.', options:[
    { v:'solo', label:'Just me', desc:'Solo founder, freelancer, or operator.' },
    { v:'small', label:'My team of 2–10', desc:'A lean business with a few people.' },
    { v:'mid', label:'A team of 11+', desc:'Departments, managers, more moving parts.' },
    { v:'curious', label:'Just exploring', desc:'No business yet — I want to understand AI.' } ] },
  { id:'leak', q:'Where does your week leak the most time?', sub:'Pick the one that stings most.', options:[
    { v:'research', label:'Looking things up', desc:'Prospects, competitors, prices — across too many tabs.' },
    { v:'writing', label:'Writing things', desc:'Emails, proposals, posts that sit half-finished in drafts.' },
    { v:'followup', label:'Following up', desc:'Leads and clients who go quiet and stay quiet.' },
    { v:'admin', label:'Admin & reporting', desc:'Scheduling, data entry, status updates, spreadsheets.' } ] },
  { id:'mrr', q:'Roughly, your monthly revenue?', sub:'Only used to suggest the right path. Skip if you like.', options:[
    { v:'low', label:'Under $10k / month', desc:'Or pre-revenue.' },
    { v:'starter', label:'$10k – $50k / month', desc:'' },
    { v:'business', label:'$50k+ / month', desc:'' },
    { v:'na', label:'Rather not say', desc:'' } ] },
];

const PROMPT_BY_LEAK = {
  research: '“Here are three competitor websites: [paste links]. Summarize what each offers and tell me how my offer is different.”',
  writing: '“Draft a short, friendly follow-up email to a client who went quiet two weeks ago. I’ll paste the last thing they said.”',
  followup: '“Write me a 3-email follow-up sequence for a lead who asked for pricing and then vanished. Polite, not pushy.”',
  admin: '“Turn these messy notes into a clean status update for my team: [paste notes].”',
};

const PLANS = {
  grey: { headline:'You’re in the grey — with 6.8 billion others.', sub:'No catching up required. Three steps gets you ahead of 84% of the planet.',
    steps: l => [
      { t:'Make a free account', d:'Go to claude.ai and sign up. That’s the entire step. No credit card, no setup.' },
      { t:'Paste one real task', d:'Take something from your actual week and try it. For you, start with: ' + PROMPT_BY_LEAK[l] },
      { t:'Repeat daily for one week', d:'One real task a day. By Friday you’ll know exactly where AI saves you time — and where it doesn’t.' } ],
    bridge:'When you’re ready for AI that works while you don’t — research, drafts, and follow-ups that run without you typing — that’s a harness. The strategy session maps yours.' },
  green: { headline:'You’re a green dot — you chat, but nothing runs without you.', sub:'The gap between you and the red sliver isn’t skill. It’s a system.',
    steps: l => [
      { t:'Pick your one workflow', d:'Choose the thing you typed into a chatbot most this month. For you that’s probably ' + (l==='research'?'research and lookups':l==='writing'?'drafting and writing':l==='followup'?'follow-ups':'admin and reporting') + '.' },
      { t:'Write the steps down', d:'Who does it, what triggers it, where the answer goes. One page. That document is the seed of a system.' },
      { t:'Turn the page into agents', d:'A strategy session takes that one-pager and maps it into agents running inside your actual tools — with you approving anything sensitive.' } ],
    bridge:'You already know AI works. The session is about making it work without you.' },
  amber: { headline:'Amber: you pay for AI. Now make it pay you back.', sub:'Subscriptions made you faster. Ownership makes you leveraged.',
    steps: () => [
      { t:'Audit your subscriptions', d:'List what you pay for and what each one automates end-to-end without you in the loop. (For most people: nothing.)' },
      { t:'Own your keys', d:'Your own API key plus an open-source harness beats rented credits, caps, and overage bills. You pay the provider directly.' },
      { t:'Pick what goes agentic first', d:'The strategy session maps which of your workflows convert from chat-assisted to agent-run — and in what order.' } ],
    bridge:'You’re one tier from the sliver. The session is the shortest path across.' },
  red: { headline:'You’re already red — let’s make it bulletproof.', sub:'Running agents is one thing. Owning a system your team can trust is another.',
    steps: () => [
      { t:'Audit ownership', d:'Who holds the code, the keys, the data? If the answer is a platform, you’re renting your red dot.' },
      { t:'Check your gates', d:'Anything customer-facing should pass a human approval gate. If it doesn’t, that’s your first fix.' },
      { t:'Plan the expansion', d:'A strategy session doubles as a harness audit: what to harden, what to add, what to hand to your team.' } ],
    bridge:'Bring what you’ve built. We’ll pressure-test it and map what’s next.' },
};

const TIER = {
  business: { name:'Business Harness', why:'Multi-agent system, up to 4 workflows, 5+ integrations. Built for teams at $50k+ MRR.' },
  starter: { name:'Starter Harness', why:'One core workflow, 2 integrations, delivered in 14 days. Built for the $10k–$50k MRR range.' },
  free: { name:'The free path first', why:'Work the steps above — they cost nothing. Book the session when a harness would pay for itself. The fee is credited toward your build either way.' },
};

let step = -1, answers = {};
const app = document.getElementById('app');

function miniGrid(color) {
  const youIdx = color==='grey'?34:color==='green'?81:color==='amber'?97:99;
  let h = '<div class="mini-grid">';
  for (let i = 0; i < 100; i++) {
    const row = Math.floor(i/10);
    let bg = COLOR.grey;
    if (row >= 8) bg = COLOR.green;
    if (i === 98) bg = COLOR.amber;
    if (i === 99) bg = COLOR.red;
    const you = i === youIdx;
    h += `<span class="${you?'you-dot':''}" style="background:${you?COLOR[color]:bg};opacity:${you?1:0.45}"></span>`;
  }
  return h + '</div>';
}

function render() {
  if (step === -1) {
    app.innerHTML = `<div class="wizard"><div class="wiz-intro">
      <div class="kicker"><span class="sw" style="background:${COLOR.red}"></span>standardized onboarding · 4 questions · 2 minutes</div>
      <h1>Find your dot.</h1>
      <p>Of 8.1 billion people, 84% have never used AI. Answer four plain-English questions and we’ll show you exactly where you sit on the grid — and the standard first steps from there. No jargon, no email required.</p>
      <button class="btn btn-green" onclick="go(0)">Start &rarr;</button></div></div>`;
    return;
  }
  if (step >= QUESTIONS.length) {
    const color = answers.usage || 'grey';
    const plan = PLANS[color];
    const tier = TIER[answers.mrr === 'business' ? 'business' : answers.mrr === 'starter' ? 'starter' : 'free'];
    const steps = plan.steps(answers.leak || 'writing');
    app.innerHTML = `<div class="wizard"><div class="wiz-result">
      <div class="wiz-result-head">${miniGrid(color)}<div>
        <div class="story-stat"><span class="sw" style="background:${COLOR[color]}"></span>your position on the grid</div>
        <h1>${plan.headline}</h1><p class="wiz-sub">${plan.sub}</p></div></div>
      <ol class="wiz-steps">${steps.map((s,i)=>`<li><span class="wiz-step-n">${i+1}</span><div><strong>${s.t}</strong><p>${s.d}</p></div></li>`).join('')}</ol>
      <div class="wiz-bridge"><p>${plan.bridge}</p></div>
      <div class="wiz-tier">
        <div class="kicker"><span class="sw" style="background:${COLOR.green}"></span>suggested path</div>
        <h3>${tier.name}</h3><p>${tier.why}</p>
        <a class="btn btn-red" href="${CAL}">Book Your Strategy Session &rarr;</a>
        <button class="wiz-restart" onclick="restart()">Start over</button>
      </div></div></div>`;
    return;
  }
  const q = QUESTIONS[step];
  app.innerHTML = `<div class="wizard">
    <div class="wiz-progress">${QUESTIONS.map((_,i)=>`<span class="${i<=step?'f':''}"></span>`).join('')}<em>${step+1} / ${QUESTIONS.length}</em></div>
    <h1>${q.q}</h1><p class="wiz-sub">${q.sub}</p>
    <div class="wiz-options">${q.options.map(o=>`<button class="wiz-option" onclick="pick('${q.id}','${o.v}')"><strong>${o.label}</strong>${o.desc?`<span>${o.desc}</span>`:''}</button>`).join('')}</div>
    ${step>0?'<button class="wiz-back" onclick="go('+(step-1)+')">&larr; back</button>':''}</div>`;
}

window.go = s => { step = s; render(); scrollTo(0,0); };
window.pick = (id, v) => { answers[id] = v; step++; render(); scrollTo(0,0); };
window.restart = () => { answers = {}; step = -1; render(); };
render();
</script>
</body>
</html>
